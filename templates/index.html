<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Rakib's Video Engine</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/hls.js@latest"></script>
</head>
<body class="bg-gray-900 text-white p-4">
    <div class="max-w-4xl mx-auto">
        <h1 class="text-3xl font-bold text-center mb-2 text-red-500">Video Search & Download</h1>
        <p class="text-center text-xs text-gray-400 mb-8">লিংক পেস্ট করুন অথবা নাম লিখে সার্চ দিন</p>
        
        <div class="flex gap-2 mb-8">
            <input type="text" id="q" placeholder="ভিডিও লিংক বা নাম..." class="w-full p-3 rounded-lg bg-gray-800 border border-gray-700 focus:outline-none">
            <button onclick="search()" class="bg-red-600 px-6 py-3 rounded-lg font-bold">Search</button>
        </div>
        
        <div id="loader" class="hidden text-center text-red-500 font-bold mb-4">ডেটা আনা হচ্ছে...</div>
        <div id="results" class="grid grid-cols-1 md:grid-cols-2 gap-6"></div>
    </div>

    <!-- Player -->
    <div id="player" class="fixed inset-0 bg-black bg-opacity-95 hidden flex flex-col items-center justify-center p-4 z-50">
        <button onclick="closePlayer()" class="absolute top-5 right-5 bg-gray-600 px-4 py-2 rounded font-bold">Close</button>
        <video id="v" controls class="w-full max-w-2xl rounded-lg shadow-lg"></video>
    </div>

    <script>
        async function search() {
            const q = document.getElementById('q').value;
            const resDiv = document.getElementById('results');
            const loader = document.getElementById('loader');
            
            resDiv.innerHTML = "";
            loader.classList.remove('hidden');

            const response = await fetch('/search?q=' + encodeURIComponent(q));
            const data = await response.json();
            loader.classList.add('hidden');

            if (data.length === 0) {
                resDiv.innerHTML = "<p class='text-center col-span-full'>কিছু পাওয়া যায়নি!</p>";
                return;
            }

            data.forEach(v => {
                const safeTitle = v.title.replace(/[^a-zA-Z0-9]/g, "_");
                const downloadUrl = `/download_file?url=${encodeURIComponent(v.m3u8)}&title=${safeTitle}`;
                
                resDiv.innerHTML += `
                    <div class="bg-gray-800 p-4 rounded-xl border border-gray-700 shadow-md">
                        <img src="${v.thumbnail}" class="w-full h-48 object-cover rounded-lg mb-3 cursor-pointer" onclick="play('${v.m3u8}')">
                        <h3 class="text-sm font-semibold h-10 overflow-hidden">${v.title}</h3>
                        <div class="flex gap-2 mt-4">
                            <button onclick="play('${v.m3u8}')" class="bg-blue-600 w-1/2 py-2 rounded-lg text-sm font-bold">Play</button>
                            <a href="${downloadUrl}" class="bg-green-600 w-1/2 py-2 rounded-lg text-sm font-bold text-center block">Download</a>
                        </div>
                    </div>
                `;
            });
        }

        function play(url) {
            const video = document.getElementById('v');
            document.getElementById('player').classList.remove('hidden');
            if (Hls.isSupported()) {
                const hls = new Hls();
                hls.loadSource(url);
                hls.attachMedia(video);
                hls.on(Hls.Events.MANIFEST_PARSED, () => video.play());
            }
        }

        function closePlayer() {
            document.getElementById('v').pause();
            document.getElementById('player').classList.add('hidden');
        }
    </script>
</body>
</html>
